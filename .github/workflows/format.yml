name: autofix.ci
on: 
  pull_request:
  push:

permissions: {}
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: |
          npm ci
          npm run format
        working-directory: ./frontend

      - uses: autofix-ci/action@v1
        with:
          commit-message: "github-actions(prettier): format"
